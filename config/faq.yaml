# 官方已公布 FAQ
# ------------------------------------------------------------
# 機器人遇到「FAQ 有涵蓋」的問題時，會「原文」顯示這裡的 answer，
# 不會改寫，確保現場人員講的跟官網/社群公告一致。
#
# 欄位說明：
#   id        唯一編號（不要重複，回覆中會顯示，方便對照）
#   category  分類
#   question  官方問題
#   answer    官方答案（原文照貼公告內容）
#   keywords  客人可能的其他問法/關鍵字，幫助比對（選填）
#
# 以下為範例，請換成你們實際公布的 FAQ。
# ------------------------------------------------------------

- id: R01
  category: 預約
  question: 要怎麼預約入場？
  answer: |
    本次快閃店採線上預約制，請至官方 LINE 帳號點選「預約入場」選單，
    選擇日期與時段後填寫資料即可完成預約。每個帳號每日限預約 1 次，每次最多 4 人。
  keywords: [預約, 訂位, 怎麼排, 報名, 預訂, 名額]

- id: R02
  category: 預約
  question: 沒有預約可以現場入場嗎？
  answer: |
    每日保留少量現場名額，於開店時在入口處發放號碼牌，發完為止。
    建議提前線上預約以確保入場。
  keywords: [現場, 沒預約, 臨時, 號碼牌, 候補, walk in]

- id: R03
  category: 預約
  question: 預約後可以更改或取消嗎？
  answer: |
    可於預約時段開始前 24 小時，透過預約確認訊息中的連結自行更改或取消。
    24 小時內恕無法更改。
  keywords: [改時間, 取消, 更改, 改期, 換時段]

- id: R04
  category: 預約
  question: 預約時段遲到怎麼辦？
  answer: |
    預約時段開始後 15 分鐘內報到皆可入場，超過 15 分鐘視同放棄，名額將釋出給現場候補。
  keywords: [遲到, 晚到, 來不及, 過號]

- id: P01
  category: 商品
  question: 每人限購數量是多少？
  answer: |
    限定商品每人每款限購 2 件，其餘商品不限量。限購以單筆結帳計算。
  keywords: [限購, 買幾個, 數量限制, 可以買多少]

- id: P02
  category: 商品
  question: 商品賣完會補貨嗎？
  answer: |
    部分商品會不定期補貨，補貨資訊將於官方 LINE 及 Instagram 公告，現場無法預留或代訂。
  keywords: [補貨, 賣完, 缺貨, 沒貨, 預留, 代訂]

- id: S01
  category: 付款
  question: 可以用哪些方式付款？
  answer: |
    現場接受現金、信用卡（Visa / Master / JCB）、LINE Pay、Apple Pay。
  keywords: [付款, 刷卡, 現金, line pay, 行動支付, apple pay]

- id: S02
  category: 售後
  question: 買了可以退換貨嗎？
  answer: |
    商品若有瑕疵，請於購買後 7 日內攜帶發票與商品聯繫官方 LINE 客服辦理。
    非瑕疵商品恕不退換。
  keywords: [退貨, 換貨, 瑕疵, 壞掉, 退款]

- id: G01
  category: 一般
  question: 營業時間與地點？
  answer: |
    活動期間每日 11:00–20:00（最後入場 19:30），地點：台北市信義區○○路○○號 1F。
  keywords: [幾點, 營業時間, 地址, 在哪, 怎麼去, 最後入場]

- id: G02
  category: 一般
  question: 可以帶寵物嗎？
  answer: |
    為維護展區安全，除導盲犬等服務犬外，寵物恕不得入場。
  keywords: [寵物, 狗, 貓, 帶毛小孩]
